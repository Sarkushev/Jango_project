<!DOCTYPE html>
<html>
<head>
    <title>Удалить пост</title>
    <style>
        .container { max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; }
        .post-preview { background: #f8f9fa; padding: 15px; margin: 20px 0; border-radius: 5px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin: 0 10px; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Удалить пост?</h2>
        <div class="post-preview">
            <h3>{{ post.title }}</h3>
            <p>{{ post.content|truncatewords:30 }}</p>
        </div>
        <p>Это действие нельзя отменить!</p>
        
        <form method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
        </form>
        <a href="{% url 'post_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
</body>
</html>
